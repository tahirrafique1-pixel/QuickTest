<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Task Flow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1.25rem 1rem 1rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    h1 { font-size: 1.25rem; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 0.5rem; }
    .btn-icon {
      background: #334155;
      border: none;
      color: #cbd5e1;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    main { flex: 1; padding: 1rem; max-width: 480px; margin: 0 auto; width: 100%; }
    .input-box {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    input[type="text"] {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: #38bdf8; }
    .btn-add {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 0 1.25rem;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    .task-list { list-style: none; display: flex; flex-direction: column; gap: 0.65rem; }
    .task-card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transition: all 0.2s ease;
    }
    .task-card.completed { opacity: 0.55; text-decoration: line-through; border-color: #1e293b; }
    .checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .task-card.completed .checkbox { background: #10b981; border-color: #10b981; color: white; }
    .task-text { flex: 1; font-size: 0.95rem; }
    .btn-del { background: transparent; border: none; color: #ef4444; font-size: 1.2rem; cursor: pointer; }
    .native-dock {
      margin-top: 1.5rem;
      padding: 1rem;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid #334155;
      border-radius: 12px;
    }
    .dock-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; margin-bottom: 0.75rem; font-weight: 600; }
    .dock-btns { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .cap-btn {
      background: #0369a1;
      border: none;
      color: white;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .stats { font-size: 0.8rem; color: #94a3b8; margin-top: 0.75rem; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>✓ TaskFlow Pro</h1>
    <button class="btn-icon" onclick="shareTasks()" title="Share Tasks">🔗</button>
  </header>

  <main>
    <div class="input-box">
      <input type="text" id="taskInput" placeholder="Add a new task..." onkeydown="if(event.key==='Enter') addTask()" />
      <button class="btn-add" onclick="addTask()">Add</button>
    </div>

    <ul class="task-list" id="taskList"></ul>

    <div class="stats" id="statsText">0 tasks</div>

    <div class="native-dock">
      <div class="dock-title">Capacitor Native Bridge Testing</div>
      <div class="dock-btns">
        <button class="cap-btn" onclick="testHaptics()">📳 Haptics</button>
        <button class="cap-btn" onclick="testToast()">🍞 Android Toast</button>
        <button class="cap-btn" onclick="shareTasks()">📤 Native Share</button>
      </div>
    </div>
  </main>

  <script>
    let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
    if (tasks.length === 0) {
      tasks = [
        { id: 1, text: 'Review AndroidManifest permissions', done: true },
        { id: 2, text: 'Test Capacitor plugins in simulator', done: false },
        { id: 3, text: 'Generate Play Store release AAB bundle', done: false }
      ];
      save();
    }

    function save() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
      render();
    }

    function render() {
      const list = document.getElementById('taskList');
      list.innerHTML = '';
      tasks.forEach(t => {
        const li = document.createElement('li');
        li.className = 'task-card' + (t.done ? ' completed' : '');
        li.innerHTML = `
          <div class="checkbox" onclick="toggle(${t.id})">${t.done ? '✓' : ''}</div>
          <span class="task-text" onclick="toggle(${t.id})">${escapeHtml(t.text)}</span>
          <button class="btn-del" onclick="removeTask(${t.id})">×</button>
        `;
        list.appendChild(li);
      });
      const pending = tasks.filter(t => !t.done).length;
      document.getElementById('statsText').innerText = `${pending} pending · ${tasks.length} total tasks`;
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const val = input.value.trim();
      if (!val) return;
      tasks.unshift({ id: Date.now(), text: val, done: false });
      input.value = '';
      save();
      triggerHaptics();
      showToast('Task added');
    }

    function toggle(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
      save();
      triggerHaptics();
    }

    function removeTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      save();
      showToast('Task removed');
    }

    function triggerHaptics() {
      if (window.Capacitor?.Plugins?.Haptics) {
        window.Capacitor.Plugins.Haptics.vibrate();
      } else if (navigator.vibrate) {
        navigator.vibrate(40);
      }
    }

    function showToast(msg) {
      if (window.Capacitor?.Plugins?.Toast) {
        window.Capacitor.Plugins.Toast.show({ text: msg });
      }
    }

    function shareTasks() {
      const text = 'Tasks: ' + tasks.map(t => (t.done ? '[x] ' : '[ ] ') + t.text).join(', ');
      if (window.Capacitor?.Plugins?.Share) {
        window.Capacitor.Plugins.Share.share({
          title: 'My Task List',
          text: text,
          dialogTitle: 'Share via Android'
        });
      } else if (navigator.share) {
        navigator.share({ title: 'TaskFlow', text: text });
      } else {
        alert(text);
      }
    }

    function testHaptics() { triggerHaptics(); showToast('Haptic pulse fired'); }
    function testToast() { showToast('Android Native Toast working via Capacitor!'); }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    render();
  </script>
</body>
</html>
